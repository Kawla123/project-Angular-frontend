<div class="container">
  <div class="row vh-100 align-items-center">
    <div class="col-xxl-6 offset-xxl-3 col-lg-8 offset-lg-2 col-10 offset-1">
      <div class="row rounded-4 border-0 shadow-lg bg-light" style="min-height:450px;">
        <!-- Left section with perfume-themed image and branding -->
        <div class="col-md-5 d-md-flex d-none bg-dark rounded-start-4 align-items-center justify-content-center">
          <div class="text-center text-white">
            <img src="assets/image/logo4.jpg" class="w-50 mb-3" alt="Perfume Logo">
            <h2 class="fw-bolder">Perfume Bliss</h2>
            <p class="fst-italic">"A scent that defines you"</p>
          </div>
        </div>
        <!-- Right section for login content -->
        <div class="col-md-7 col-12 d-flex justify-content-start align-items-center">
          <div class="p-5 w-100" [@routerFadeIn]="getRouteUrl()">
           
            <router-outlet></router-outlet>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
